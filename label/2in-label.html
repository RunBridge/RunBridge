<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBridge 2-inch Circle Label</title>
    <style>
        /* Physical page size for 2" × 2" label (printer / die-cut circle) */
        @page {
            size: 2in 2in;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            width: 2in;
            height: 2in;
            min-width: 2in;
            min-height: 2in;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        /* Safe zone: keep content inside so nothing is cut off by circular die-cut */
        .safe-zone {
            width: 1.35in;
            height: 1.35in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        /* Logo with transparent background: full logo fits in box, no crop */
        .logo-wrap {
            max-width: 1.2in;
            max-height: 0.4in;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-wrap .logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .address-block {
            font-size: 8pt;
            line-height: 1.25;
            font-weight: 600;
            color: black;
        }

        .compliance-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.12in;
            width: 100%;
            padding-top: 2px;
        }

        /* Official marks: min 5 mm; typical on 2" labels 6–7 mm. Do not stretch or change proportions. */
        .compliance-row .mark {
            width: auto;
            object-fit: contain;
        }

        .compliance-row .mark.ce {
            height: 0.26in;   /* ~6.6 mm */
        }

        .compliance-row .mark.ukca {
            height: 0.26in;  /* ~6.6 mm */
        }

        .compliance-row .mark.weee {
            height: 0.28in;  /* ~7 mm */
        }

        @media print {
            body {
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="safe-zone">
        <!-- RunBridge logo (transparent background) -->
        <div class="logo-wrap">
            <img src="RunBridgeLogo-nobg.png" class="logo" alt="RunBridge" />
        </div>

        <div class="address-block">
            RunBridge<br>
            Seymour, Indiana, USA<br>
            runbridge.dev
        </div>

        <!-- Official artwork: CE (EC/Wikimedia), UKCA (GOV.UK/Wikimedia), WEEE (Wikimedia). Do not modify. -->
        <div class="compliance-row">
            <img src="ce-mark.svg" alt="CE" class="mark ce" />
            <img src="ukca-mark.svg" alt="UKCA" class="mark ukca" />
            <img src="weee-bin.svg" alt="WEEE" class="mark weee" />
        </div>
    </div>

</body>
</html>
